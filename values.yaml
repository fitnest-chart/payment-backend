epoint:
  baseUrl: https://epoint.az/api/1
  resultUrl: https://api.fitnest.az/payment/callback
hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 450Mi
  minReplicas: '1'
image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/payment-backend
  tag: production-f6d0b94
networkPolicy:
  allowedServices:
    - user-backend
    - identity-backend
    - order-backend
  enabled: true
replicaCount: 1
resources:
  limits:
    cpu: 1000m
    memory: 868Mi
  requests:
    cpu: 20m
    memory: 564Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: production
database:
  hikariMaxPool: 30
  hikariMinIdle: 10
