epoint:
  baseUrl: https://epoint.az/api/1
  resultUrl: https://api.fitnest.az/payment/callback
hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 450Mi
  minReplicas: '1'
image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/payment-backend
  tag: development-8ec3c43
networkPolicy:
  allowedServices:
    - user-backend
    - identity-backend
    - order-backend
  enabled: true
# Held at 1 while the cluster is memory-constrained (worker nodes are overcommitted
# on limits). Rollouts are still zero-downtime via maxUnavailable:0 + maxSurge:1, but
# a node failure is an outage until rescheduled. Raise to 2 when there is headroom --
# the PodDisruptionBudget and topology spread turn on automatically above 1.
replicaCount: 1
terminationGracePeriodSeconds: 45
security:
  # Enable once gateway-backend sends X-Internal-Token on proxied requests.
  requireInternalToken: false
  # Swagger UI and the OpenAPI document are not served publicly in production.
  exposeDocs: false
# NOTE: KAFKA_BOOTSTRAP_SERVERS is deliberately NOT set here. It comes from Vault
# (secrets/payment-backend/production). An env var would take precedence over the
# Vault property source and override the correct broker address.
resources:
  requests:
    cpu: 200m
    memory: 640Mi
  limits:
    cpu: 2000m
    memory: 1280Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: development
database:
  hikariMaxPool: 30
  hikariMinIdle: 10
