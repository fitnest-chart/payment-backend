# values.yaml for payment-backend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/payment-backend
  tag: "development-0572476"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
networkPolicy:
  enabled: true
  allowedServices:
    - user-backend
    - identity-backend
    - order-backend
    # gateway-backend is already hardcoded in the policy template
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
env:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://10.0.0.4:5432/fitnest_payment?sslmode=disable"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "shared_password_root_123"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATA_REDIS_HOST: "10.0.0.4"
  SPRING_DATA_REDIS_PORT: "6380"
  SPRING_DATA_REDIS_PASSWORD: "ChangeMeDevRedis!"
  KAFKA_BOOTSTRAP_SERVERS: "10.0.0.4:9092"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  IDENTITY_BACKEND_URL: "http://identity-backend:8080"
  USER_BACKEND_URL: "http://user-backend:8080"
  ORDER_BACKEND_URL: "http://order-backend:8080"
  STORAGE_BACKEND_URL: "http://storage-backend:8080"
  USE_GRPC_STORAGE: "false"
  STORAGE_GRPC_ADDRESS: "dns:///storage-backend.fitnest-development.svc.cluster.local:9090"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

envSecrets:
  EPOINT_PUBLIC_KEY:
    secretName: epoint-secret
    secretKey: public-key
  EPOINT_PRIVATE_KEY:
    secretName: epoint-secret
    secretKey: private-key
epoint:
  baseUrl: https://epoint.az/api/1
  resultUrl: https://dev-api.fitnest.az/payment/callback
resources:
  requests:
    cpu: 20m
    memory: 564Mi
  limits:
    cpu: 1000m
    memory: 868Mi
