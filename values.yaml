epoint:
  baseUrl: https://epoint.az/api/1
  resultUrl: https://api.fitnest.az/payment/callback
hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 450Mi
  minReplicas: '1'
image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/payment-backend
  tag: production-98ac651
networkPolicy:
  allowedServices:
    - user-backend
    - identity-backend
    - order-backend
  enabled: true
# Two replicas so a rollout, node drain, or single-pod crash is not a payment outage.
replicaCount: 2
terminationGracePeriodSeconds: 45
security:
  # Enable once gateway-backend sends X-Internal-Token on proxied requests.
  requireInternalToken: false
  # Swagger UI and the OpenAPI document are not served publicly in production.
  exposeDocs: false
kafka:
  bootstrapServers: kafka-service.fitnest-production.svc.cluster.local:9092
resources:
  requests:
    cpu: 200m
    memory: 1280Mi
  limits:
    cpu: 2000m
    memory: 2048Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: production
database:
  hikariMaxPool: 30
  hikariMinIdle: 10
