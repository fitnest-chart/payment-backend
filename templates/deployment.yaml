apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.fullname" . }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            - name: EPOINT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: epoint-secret
                  key: public-key
            - name: EPOINT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: epoint-secret
                  key: private-key
            - name: EPOINT_BASE_URL
              value: {{ .Values.epoint.baseUrl | quote }}
            - name: EPOINT_RESULT_URL
              value: {{ .Values.epoint.resultUrl | quote }}
            - name: EPOINT_SUCCESS_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: epoint-url-secret
                  key: success-redirect-url
            - name: EPOINT_ERROR_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: epoint-url-secret
                  key: error-redirect-url
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
            - name: SPRINGDOC_SERVER_URL
              value: {{ .Values.env.SPRINGDOC_SERVER_URL | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.env.SPRING_DATASOURCE_URL | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.env.SPRING_DATASOURCE_USERNAME | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.env.SPRING_DATASOURCE_PASSWORD | quote }}
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: {{ .Values.env.SPRING_JPA_HIBERNATE_DDL_AUTO | quote }}
            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.env.SPRING_DATA_REDIS_HOST | quote }}
            - name: SPRING_DATA_REDIS_PORT
              value: {{ .Values.env.SPRING_DATA_REDIS_PORT | quote }}
            - name: SPRING_DATA_REDIS_PASSWORD
              value: {{ .Values.env.SPRING_DATA_REDIS_PASSWORD | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.KAFKA_BOOTSTRAP_SERVERS | quote }}
            - name: JWT_SECRET
              value: {{ .Values.env.JWT_SECRET | quote }}
            - name: JWT_ISSUER
              value: {{ .Values.env.JWT_ISSUER | quote }}
            - name: IDENTITY_SERVICE_URL
              value: {{ .Values.env.IDENTITY_SERVICE_URL | quote }}
            - name: USER_SERVICE_URL
              value: {{ .Values.env.USER_SERVICE_URL | quote }}
            - name: ORDER_SERVICE_URL
              value: {{ .Values.env.ORDER_SERVICE_URL | quote }}
            - name: STORAGE_SERVICE_URL
              value: {{ .Values.env.STORAGE_SERVICE_URL | quote }}
            - name: USE_GRPC_STORAGE
              value: {{ .Values.env.USE_GRPC_STORAGE | quote }}
            - name: STORAGE_GRPC_ADDRESS
              value: {{ .Values.env.STORAGE_GRPC_ADDRESS | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.env.JAVA_TOOL_OPTIONS | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}