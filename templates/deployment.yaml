apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-service.fullname" . }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
  {{- if .Values.istio.enabled }}
  annotations:
    sidecar.istio.io/inject: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "payment-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "payment-service.fullname" . }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: payment-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: EPOINT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: epoint-secret
                  key: public-key
            - name: EPOINT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: epoint-secret
                  key: private-key
            - name: EPOINT_BASE_URL
              value: "{{ .Values.epoint.baseUrl }}"
            - name: EPOINT_RESULT_URL
              value: "{{ .Values.epoint.resultUrl }}"
            - name: EPOINT_SUCCESS_REDIRECT_URL
              value: "{{ .Values.epoint.successRedirectUrl }}"
            - name: EPOINT_ERROR_REDIRECT_URL
              value: "{{ .Values.epoint.errorRedirectUrl }}"
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.env.SPRING_PROFILES_ACTIVE }}"
            - name: SPRINGDOC_SERVER_URL
              value: "{{ .Values.env.SPRINGDOC_SERVER_URL }}"
            - name: SPRING_DATASOURCE_URL
              value: "{{ .Values.env.SPRING_DATASOURCE_URL }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.env.SPRING_DATASOURCE_USERNAME }}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{ .Values.env.SPRING_DATASOURCE_PASSWORD }}"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "{{ .Values.env.SPRING_JPA_HIBERNATE_DDL_AUTO }}"
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ .Values.env.SPRING_DATA_REDIS_HOST }}"
            - name: SPRING_DATA_REDIS_PORT
              value: "{{ .Values.env.SPRING_DATA_REDIS_PORT }}"
            - name: SPRING_DATA_REDIS_PASSWORD
              value: "{{ .Values.env.SPRING_DATA_REDIS_PASSWORD }}"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Values.env.KAFKA_BOOTSTRAP_SERVERS }}"
            - name: JWT_SECRET
              value: "{{ .Values.env.JWT_SECRET }}"
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
