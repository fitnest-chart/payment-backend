{ { - if .Values.istio.enabled } }
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: { { include "payment-service.fullname" . } }-auth-policy
  namespace: { { .Release.Namespace } }
  labels:
    { { - include "payment-service.labels" . | nindent 4 } }
spec:
  selector:
    matchLabels:
      { { - include "payment-service.selectorLabels" . | nindent 6 } }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/api-gateway-sa"
              # Add other internal service accounts here if they need to call this service directly
  { { - end } }
